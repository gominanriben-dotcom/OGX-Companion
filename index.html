function dConfid(){$('p-confid').innerHTML=head('Politique de confidentialité','Comment vos données sont traitées.')+'<div class="card doc"><h3>Données enregistrées</h3><p>OGX Companion enregistre, dans le navigateur de l’appareil que vous utilisez, vos réglages (signature, coordonnées du responsable local, numéro de paiement, adresse du script), la liste des participants que vous saisissez, l’historique des envois et vos modèles personnalisés.</p><h3>Aucun serveur</h3><p>L’application ne dispose d’aucun serveur et ne transmet ces données à aucun service d’analyse ou de publicité. Elle n’utilise pas de cookies de suivi.</p><h3>Envoi des messages</h3><p>Lorsque vous envoyez un message, son contenu et l’adresse du destinataire sont transmis au script Google installé dans votre compte, qui l’expédie via Gmail. Google traite ces informations selon ses propres conditions.</p><h3>Police de caractères</h3><p>L’affichage utilise une police chargée depuis Google Fonts : votre navigateur contacte donc les serveurs de Google à l’ouverture de l’application.</p><h3>Vos responsabilités</h3><p>Les données des participants (nom, adresse e-mail, informations de paiement) sont des données personnelles. Utilisez-les uniquement pour le suivi des échanges, respectez les règles de protection des données applicables et les consignes de votre organisation, et supprimez-les lorsqu’elles ne sont plus nécessaires.</p><h3>Suppression</h3><p>Vous pouvez effacer toutes les données à tout moment depuis le Profil, avec « Réinitialiser les données ».</p></div>'}
function dCgu(){$('p-cgu').innerHTML=head('Conditions d’utilisation','Règles d’usage de l’application.')+'<div class="card doc"><h3>Usage prévu</h3><p>OGX Companion est destiné aux équipes Outgoing Exchange pour préparer et envoyer des communications légitimes aux participants à l’échange. Il ne doit pas servir à l’envoi de messages non sollicités.</p><h3>Contenu des messages</h3><p>Vous restez responsable du contenu des messages et de l’exactitude des informations saisies : montants, dates limites, numéros de paiement, liens et coordonnées. Relisez toujours l’aperçu et effectuez un envoi test après toute modification d’un modèle.</p><h3>Accès au script</h3><p>L’adresse du script et le mot de passe donnent accès à l’envoi depuis votre compte. Gardez-les confidentiels.</p><h3>Limites d’envoi</h3><p>Les quotas d’envoi sont fixés par Google et ne dépendent pas de l’application. Un compte Gmail personnel est limité à 100 destinataires par jour via Apps Script, un compte Google Workspace à 1 500.</p><h3>Garanties</h3><p>L’application est fournie en l’état, sans garantie de disponibilité ni de résultat. Le rendu des e-mails peut varier selon les messageries.</p></div>'}
function dSupport(){$('p-support').innerHTML=head('Support','Obtenir de l’aide en cas de difficulté.')+'<div class="card doc"><h3>1. Consultez la FAQ</h3><p>La plupart des questions (installation du script, mot de passe, quotas, modification d’un modèle) y sont traitées pas à pas.</p><div class="acts"><button class="btn" type="button" data-go="faq">Ouvrir la FAQ</button></div></div><div class="card doc"><h3>2. Vérifiez l’envoi</h3><p>Dans Vérification de l’envoi, touchez « Vérifier la connexion » pour savoir si le script répond.</p><div class="acts"><button class="btn" type="button" data-go="verif">Vérifier l’envoi</button></div></div><div class="card doc"><h3>3. Transmettez un rapport de diagnostic</h3><p>Si le problème persiste, copiez le rapport ci-dessous et transmettez-le à la personne qui administre l’application. Il indique la version, le navigateur, l’état de la configuration et la dernière erreur. Il ne contient ni votre mot de passe ni l’adresse complète de votre script.</p><div class="acts"><button class="btn p" id="diag" type="button">Copier le rapport</button></div></div>'}
var FQ=[
['À quoi sert OGX Companion ?','<p>OGX Companion aide les équipes Outgoing Exchange à écrire et envoyer rapidement des e-mails soignés et cohérents aux participants à l’échange. Chaque étape du parcours (premier contact, acceptation et paiement, séminaire de préparation, suivi, débriefing) dispose d’un modèle prêt à l’emploi. Vous renseignez les informations propres au participant : l’application complète le message et l’envoie depuis votre compte Gmail.</p>'],
['Comment envoyer un message à un participant ?','<ol><li>Sur l’accueil, choisissez un modèle, ou touchez « Nouveau ».</li><li>Dans l’onglet Participant, renseignez l’adresse e-mail et les champs demandés.</li><li>Ouvrez l’onglet Aperçu (bouton central) et relisez le message.</li><li>Touchez « Envoyer au participant » et confirmez.</li></ol>'],
['Que signifient les champs surlignés en orange ?','<p>Dans l’aperçu, un texte orange entre crochets, par exemple [Prénom], signale une information manquante. L’envoi est bloqué tant qu’il en reste, afin d’éviter qu’un message incomplet ne parte. Complétez le champ dans l’onglet Participant ou, s’il s’agit d’un réglage d’équipe (signature, numéro de paiement, responsable local), dans Profil > Informations personnelles.</p>'],
['Comment fonctionne l’envoi par Gmail ?','<p>L’application ne possède aucun serveur. Elle transmet le message à un petit script Google (Apps Script) que vous installez une fois dans votre compte. Ce script envoie le message depuis votre adresse Gmail ou Google Workspace : le participant voit donc votre adresse comme expéditeur, et le message apparaît dans votre dossier Envoyés.</p>'],
['Comment installer le script d’envoi ?','<ol><li>Ouvrez script.google.com avec le compte qui enverra les e-mails et créez un nouveau projet.</li><li>Supprimez le code existant et collez le contenu du fichier apps-script.gs.</li><li>Dans Paramètres du projet, ajoutez une propriété de script nommée OGX_PASS avec le mot de passe de votre choix.</li><li>Cliquez sur Déployer, puis Nouveau déploiement, type Application Web. Exécuter en tant que : Moi. Qui a accès : Tout le monde.</li><li>Autorisez l’accès lorsque Google le demande.</li><li>Copiez l’adresse du déploiement (elle se termine par /exec) dans Profil > Vérification de l’envoi, puis saisissez le mot de passe dans Profil > Sécurité.</li><li>Touchez « Vérifier la connexion ».</li></ol>'],
['Le message « Mot de passe incorrect » s’affiche. Que faire ?','<p>Cela signifie que le script a bien été joint, mais que le mot de passe saisi dans l’application diffère de celui enregistré dans le script. Vérifiez que la propriété s’appelle exactement OGX_PASS, retapez le même mot de passe à la main aux deux endroits, sans espace avant ou après, et évitez le remplissage automatique du navigateur.</p>'],
['L’envoi échoue ou ne répond pas. Comment diagnostiquer ?','<ol><li>Dans Vérification de l’envoi, touchez « Vérifier la connexion ».</li><li>Si aucune réponse n’est reçue, vérifiez que le déploiement est en accès « Tout le monde » et que l’adresse se termine par /exec.</li><li>Si vous avez modifié le script, créez une nouvelle version dans Déployer > Gérer les déploiements.</li><li>Dans Apps Script, ouvrez la page Exécutions : si une ligne doPost apparaît, la requête est bien arrivée au script.</li><li>Sinon, copiez le rapport de diagnostic (Profil > Support) et transmettez-le à la personne qui administre l’application.</li></ol>'],
['Combien de messages puis-je envoyer par jour ?','<p>Google limite les envois par Apps Script : 100 destinataires par jour avec un compte Gmail personnel, 1 500 avec un compte Google Workspace. Après chaque envoi, l’application affiche le nombre d’envois restants pour la journée. Le quota est renouvelé quotidiennement.</p>'],
['Comment ajouter ou changer le logo ?','<p>Dans Profil > Informations personnelles, rubrique Logo, collez l’adresse https d’une image hébergée en ligne (finissant par .png, .jpg ou .svg). Un lien de téléchargement ou de partage (Drive, WeTransfer) ne fonctionne pas dans un e-mail. Laissez le champ vide pour utiliser le logo AIESEC par défaut.</p>'],
['Comment modifier le texte ou la mise en page d’un e-mail ?','<p>Ouvrez Outils > Avancé, choisissez le modèle et modifiez son code HTML. Pour être aidé, décrivez la modification souhaitée, copiez la demande générée pour l’IA, collez-la dans ChatGPT, Claude ou Gemini, puis collez le code obtenu dans l’application. Vérifiez l’aperçu et enregistrez. Vous pouvez rétablir le modèle d’origine à tout moment. Faites toujours un envoi test après une modification.</p>'],
['Où sont enregistrées mes données ?','<p>Tout est enregistré dans le navigateur de l’appareil que vous utilisez : réglages, participants, historique et modèles personnalisés. Rien n’est envoyé à un serveur de l’application. Conséquence : un autre appareil ou un autre navigateur ne voit pas ces données, et vider les données du navigateur les supprime. Pensez à exporter régulièrement la liste des participants.</p>'],
['Comment exporter la liste des participants ?','<p>Ouvrez Outils > Participants, puis touchez « Exporter en CSV ». Le fichier s’ouvre dans Excel ou Google Sheets. Si le téléchargement est bloqué, utilisez « Copier le CSV » et collez le contenu dans une feuille de calcul.</p>'],
['Comment ajouter un objectif de développement durable (ODD) ?','<p>Dans l’onglet Participant, rubrique « Objectif de développement durable », choisissez l’ODD correspondant à l’opportunité. Une carte aux couleurs de cet objectif est ajoutée au message, avec un texte officiel que vous pouvez remplacer par le vôtre. Laissez « Aucun » pour ne pas l’afficher.</p>'],
['Comment sont calculées les dates limites ?','<p>Pour l’acceptation et le paiement, la date limite est fixée automatiquement à un mois après la date d’acceptation saisie. Pour le choix de la date de départ, elle est fixée à une semaine après la date d’approbation. Pour modifier ces délais, adaptez le modèle dans Outils > Avancé.</p>'],
['Puis-je utiliser l’application à plusieurs ?','<p>Oui. Chaque membre de l’équipe peut utiliser l’application sur son appareil avec le même script d’envoi : les messages partent alors depuis le compte Google qui a installé ce script. Chacun peut aussi installer son propre script pour envoyer depuis sa propre adresse. Dans les deux cas, les données enregistrées restent propres à chaque appareil.</p>'],
['Comment effacer mes données ?','<p>Dans Profil, touchez « Réinitialiser les données » en bas de page. Cette action supprime les réglages, les participants, l’historique et les modèles personnalisés de cet appareil. Elle est irréversible : exportez d’abord les données dont vous avez besoin.</p>']];

 var vars=Object.keys(F).filter(function(k){return k!=='odd'&&k!=='odd_texte'}).map(function(k){return '<code>{'+k+'}</code> '+E(F[k][0])}).join('<br>');

 '<div class="mute" style="margin-top:8px">'+(c&&c.html?'Version personnalisée active.':'Version d’origine.')+'</div>'+

 '<div class="acts"><button class="btn p" id="avprev" type="button">Aperçu</button><button class="btn" id="avsave" type="button">Enregistrer</button><button class="btn" id="avcopy" type="button">Copier le code</button><button class="btn d" id="avreset" type="button">Rétablir l’original</button></div></div>'+
 '<div class="card"><h3>Modifier avec une IA</h3><div class="mute">1. Décrivez la modification souhaitée. 2. Copiez la demande et collez-la dans ChatGPT, Claude ou Gemini. 3. Collez le code obtenu dans la zone « Code HTML » ci-dessus, vérifiez l’aperçu, puis enregistrez.</div><label for="avq">Votre demande</label><textarea id="avq" rows="3" placeholder="Ex. : ajoute une phrase de rappel sur le numéro WhatsApp et passe le bouton en vert foncé."></textarea><div class="acts"><button class="btn p" id="avai" type="button">Copier la demande pour l’IA</button></div></div>'+

 return false}
