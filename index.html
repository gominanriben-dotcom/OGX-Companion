function dConfid(){$('p-confid').innerHTML=head('Politique de confidentialité','Comment vos données sont traitées.')+'<div class="card doc"><h3>Données enregistrées</h3><p>OGX Companion enregistre, dans le navigateur de l’appareil que vous utilisez, vos réglages (signature, coordonnées du responsable local, numéro de paiement, adresse du script), la liste des participants que vous saisissez, l’historique des envois et vos modèles personnalisés.</p><h3>Aucun serveur</h3><p>L’application ne dispose d’aucun serveur et ne transmet ces données à aucun service d’analyse ou de publicité. Elle n’utilise pas de cookies de suivi.</p><h3>Envoi des messages</h3><p>Lorsque vous envoyez un message, son contenu et l’adresse du destinataire sont transmis au script Google installé dans votre compte, qui l’expédie via Gmail. Google traite ces informations selon ses propres conditions.</p><h3>Police de caractères</h3><p>L’affichage utilise une police chargée depuis Google Fonts : votre navigateur contacte donc les serveurs de Google à l’ouverture de l’application.</p><h3>Vos responsabilités</h3><p>Les données des participants (nom, adresse e-mail, informations de paiement) sont des données personnelles. Utilisez-les uniquement pour le suivi des échanges, respectez les règles de protection des données applicables et les consignes de votre organisation, et supprimez-les lorsqu’elles ne sont plus nécessaires.</p><h3>Suppression</h3><p>Vous pouvez effacer toutes les données à tout moment depuis le Profil, avec « Réinitialiser les données ».</p></div>'}
function dCgu(){$('p-cgu').innerHTML=head('Conditions d’utilisation','Règles d’usage de l’application.')+'<div class="card doc"><h3>Usage prévu</h3><p>OGX Companion est destiné aux équipes Outgoing Exchange pour préparer et envoyer des communications légitimes aux participants à l’échange. Il ne doit pas servir à l’envoi de messages non sollicités.</p><h3>Contenu des messages</h3><p>Vous restez responsable du contenu des messages et de l’exactitude des informations saisies : montants, dates limites, numéros de paiement, liens et coordonnées. Relisez toujours l’aperçu et effectuez un envoi test après toute modification d’un modèle.</p><h3>Accès au script</h3><p>L’adresse du script et le mot de passe donnent accès à l’envoi depuis votre compte. Gardez-les confidentiels.</p><h3>Limites d’envoi</h3><p>Les quotas d’envoi sont fixés par Google et ne dépendent pas de l’application. Un compte Gmail personnel est limité à 100 destinataires par jour via Apps Script, un compte Google Workspace à 1 500.</p><h3>Garanties</h3><p>L’application est fournie en l’état, sans garantie de disponibilité ni de résultat. Le rendu des e-mails peut varier selon les messageries.</p></div>'}
function dSupport(){$('p-support').innerHTML=head('Support','Obtenir de l’aide en cas de difficulté.')+'<div class="card doc"><h3>1. Consultez la FAQ</h3><p>La plupart des questions (installation du script, mot de passe, quotas, modification d’un modèle) y sont traitées pas à pas.</p><div class="acts"><button class="btn" type="button" data-go="faq">Ouvrir la FAQ</button></div></div><div class="card doc"><h3>2. Vérifiez l’envoi</h3><p>Dans Vérification de l’envoi, touchez « Vérifier la connexion » pour savoir si le script répond.</p><div class="acts"><button class="btn" type="button" data-go="verif">Vérifier l’envoi</button></div></div><div class="card doc"><h3>3. Transmettez un rapport de diagnostic</h3><p>Si le problème persiste, copiez le rapport ci-dessous et transmettez-le à la personne qui administre l’application. Il indique la version, le navigateur, l’état de la configuration et la dernière erreur. Il ne contient ni votre mot de passe ni l’adresse complète de votre script.</p><div class="acts"><button class="btn p" id="diag" type="button">Copier le rapport</button></div></div>'}
var FQ=[
['À quoi sert OGX Companion ?','<p>OGX Companion aide les équipes Outgoing Exchange à écrire et envoyer rapidement des e-mails soignés et cohérents aux participants à l’échange. Chaque étape du parcours (premier contact, acceptation et paiement, séminaire de préparation, suivi, débriefing) dispose d’un modèle prêt à l’emploi. Vous renseignez les informations propres au participant : l’application complète le message et l’envoie depuis votre compte Gmail.</p>'],
['Comment envoyer un message à un participant ?','<ol><li>Sur l’accueil, choisissez un modèle, ou touchez « Nouveau ».</li><li>Dans l’onglet Participant, renseignez l’adresse e-mail et les champs demandés.</li><li>Ouvrez l’onglet Aperçu (bouton central) et relisez le message.</li><li>Touchez « Envoyer au participant » et confirmez.</li></ol>'],
['Que signifient les champs surlignés en orange ?','<p>Dans l’aperçu, un texte orange entre crochets, par exemple [Prénom], signale une information manquante. L’envoi est bloqué tant qu’il en reste, afin d’éviter qu’un message incomplet ne parte. Complétez le champ dans l’onglet Participant ou, s’il s’agit d’un réglage d’équipe (signature, numéro de paiement, responsable local), dans Profil > Informations personnelles.</p>'],
['Comment fonctionne l’envoi par Gmail ?','<p>L’application ne possède aucun serveur. Elle transmet le message à un petit script Google (Apps Script) que vous installez une fois dans votre compte. Ce script envoie le message depuis votre adresse Gmail ou Google Workspace : le participant voit donc votre adresse comme expéditeur, et le message apparaît dans votre dossier Envoyés.</p>'],
['Comment installer le script d’envoi ?','<ol><li>Ouvrez script.google.com avec le compte qui enverra les e-mails et créez un nouveau projet.</li><li>Supprimez le code existant et collez le contenu du fichier apps-script.gs.</li><li>Dans Paramètres du projet, ajoutez une propriété de script nommée OGX_PASS avec le mot de passe de votre choix.</li><li>Cliquez sur Déployer, puis Nouveau déploiement, type Application Web. Exécuter en tant que : Moi. Qui a accès : Tout le monde.</li><li>Autorisez l’accès lorsque Google le demande.</li><li>Copiez l’adresse du déploiement (elle se termine par /exec) dans Profil > Vérification de l’envoi, puis saisissez le mot de passe dans Profil > Sécurité.</li><li>Touchez « Vérifier la connexion ».</li></ol>'],
['Le message « Mot de passe incorrect » s’affiche. Que faire ?','<p>Cela signifie que le script a bien été joint, mais que le mot de passe saisi dans l’application diffère de celui enregistré dans le script. Vérifiez que la propriété s’appelle exactement OGX_PASS, retapez le même mot de passe à la main aux deux endroits, sans espace avant ou après, et évitez le remplissage automatique du navigateur.</p>'],
['L’envoi échoue ou ne répond pas. Comment diagnostiquer ?','<ol><li>Dans Vérification de l’envoi, touchez « Vérifier la connexion ».</li><li>Si aucune réponse n’est reçue, vérifiez que le déploiement est en accès « Tout le monde » et que l’adresse se termine par /exec.</li><li>Si vous avez modifié le script, créez une nouvelle version dans Déployer > Gérer les déploiements.</li><li>Dans Apps Script, ouvrez la page Exécutions : si une ligne doPost apparaît, la requête est bien arrivée au script.</li><li>Sinon, copiez le rapport de diagnostic (Profil > Support) et transmettez-le à la personne qui administre l’application.</li></ol>'],
['Combien de messages puis-je envoyer par jour ?','<p>Google limite les envois par Apps Script : 100 destinataires par jour avec un compte Gmail personnel, 1 500 avec un compte Google Workspace. Après chaque envoi, l’application affiche le nombre d’envois restants pour la journée. Le quota est renouvelé quotidiennement.</p>'],
['Comment ajouter ou changer le logo ?','<p>Dans Profil > Informations personnelles, rubrique Logo, collez l’adresse https d’une image hébergée en ligne (finissant par .png, .jpg ou .svg). Un lien de téléchargement ou de partage (Drive, WeTransfer) ne fonctionne pas dans un e-mail. Laissez le champ vide pour utiliser le logo AIESEC par défaut.</p>'],
['Comment modifier le texte ou la mise en page d’un e-mail ?','<p>Ouvrez Outils > Avancé, choisissez le modèle et modifiez son code HTML. Pour être aidé, décrivez la modification souhaitée, copiez la demande générée pour l’IA, collez-la dans ChatGPT, Claude ou Gemini, puis collez le code obtenu dans l’application. Vérifiez l’aperçu et enregistrez. Vous pouvez rétablir le modèle d’origine à tout moment. Faites toujours un envoi test après une modification.</p>'],
['Où sont enregistrées mes données ?','<p>Tout est enregistré dans le navigateur de l’appareil que vous utilisez : réglages, participants, historique et modèles personnalisés. Rien n’est envoyé à un serveur de l’application. Conséquence : un autre appareil ou un autre navigateur ne voit pas ces données, et vider les données du navigateur les supprime. Pensez à exporter régulièrement la liste des participants.</p>'],
['Comment exporter la liste des participants ?','<p>Ouvrez Outils > Participants, puis touchez « Exporter en CSV ». Le fichier s’ouvre dans Excel ou Google Sheets. Si le téléchargement est bloqué, utilisez « Copier le CSV » et collez le contenu dans une feuille de calcul.</p>'],
['Comment ajouter un objectif de développement durable (ODD) ?','<p>Dans l’onglet Participant, rubrique « Objectif de développement durable », choisissez l’ODD correspondant à l’opportunité. Une carte aux couleurs de cet objectif est ajoutée au message, avec un texte officiel que vous pouvez remplacer par le vôtre. Laissez « Aucun » pour ne pas l’afficher.</p>'],
['Comment sont calculées les dates limites ?','<p>Pour l’acceptation et le paiement, la date limite est fixée automatiquement à un mois après la date d’acceptation saisie. Pour le choix de la date de départ, elle est fixée à une semaine après la date d’approbation. Pour modifier ces délais, adaptez le modèle dans Outils > Avancé.</p>'],
['Puis-je utiliser l’application à plusieurs ?','<p>Oui. Chaque membre de l’équipe peut utiliser l’application sur son appareil avec le même script d’envoi : les messages partent alors depuis le compte Google qui a installé ce script. Chacun peut aussi installer son propre script pour envoyer depuis sa propre adresse. Dans les deux cas, les données enregistrées restent propres à chaque appareil.</p>'],
['Comment effacer mes données ?','<p>Dans Profil, touchez « Réinitialiser les données » en bas de page. Cette action supprime les réglages, les participants, l’historique et les modèles personnalisés de cet appareil. Elle est irréversible : exportez d’abord les données dont vous avez besoin.</p>']];

es, follow applicable data rules and your organization’s guidance, and delete them when no longer needed.','Vous pouvez effacer toutes les données à tout moment depuis le Profil, avec « Réinitialiser les données ».':'You can erase all data at any time from Profile using “Reset data”.','Conditions d’utilisation':'Terms of use','Règles d’usage de l’application.':'App usage guidelines.','Usage prévu':'Intended use','OGX Companion est destiné aux équipes Outgoing Exchange pour préparer et envoyer des communications légitimes aux participants à l’échange. Il ne doit pas servir à l’envoi de messages non sollicités.':'OGX Companion helps Outgoing Exchange teams prepare and send appropriate messages to exchange participants. Do not use it to send unsolicited messages.','Vous restez responsable du contenu des messages et de l’exactitude des informations saisies : montants, dates limites, numéros de paiement, liens et coordonnées. Relisez toujours l’aperçu et effectuez un envoi test après toute modification d’un modèle.':'You are responsible for message content and the accuracy of amounts, deadlines, payment numbers, links, and contact details. Always review the preview and send a test after changing a template.','L’adresse du script et le mot de passe donnent accès à l’envoi depuis votre compte. Gardez-les confidentiels.':'The script URL and password allow messages to be sent from your account. Keep them confidential.','Les quotas d’envoi sont fixés par Google et ne dépendent pas de l’application. Un compte Gmail personnel est limité à 100 destinataires par jour via Apps Script, un compte Google Workspace à 1 500.':'Google sets the sending quotas. Apps Script allows up to 100 recipients per day for personal Gmail accounts and 1,500 for Google Workspace accounts.','L’application est fournie en l’état, sans garantie de disponibilité ni de résultat. Le rendu des e-mails peut varier selon les messageries.':'The app is provided as is, without a guarantee of availability or results. Email appearance may vary by mail service.',

e the button to dark green.','Copier la demande pour l’IA':'Copy prompt for AI','Aperçu du code':'Code preview','Variables disponibles':'Available variables','Carte ODD (facultative)':'SDG card (optional)','Les modifications sont enregistrées sur cet appareil. Les variables entre accolades sont remplacées automatiquement par les informations du participant.':'Changes are saved on this device. Variables in braces are automatically replaced with participant information.','Variables inconnues : ':'Unknown variables: ','Elles resteront affichées telles quelles. Enregistrer quand même ?':'They will remain unchanged. Save anyway?','Rétablir l’original':'Restore original','Code copié':'Code copied','Aperçu':'Preview','Enregistrer':'Save','Copier le code':'Copy code','Votre prochaine étape':'Your next step','Questions fréquentes et réponses détaillées.':'Frequently asked questions and detailed answers.','Les modifications sont enregistrées sur cet appareil.':'Changes are saved on this device.',

'Bonjour {prenom}, **félicitations pour votre inscription sur la plateforme AIESEC.** Vous venez de franchir une première étape importante vers une expérience internationale qui peut transformer votre parcours personnel et professionnel.':'Hello {prenom}, **congratulations on signing up on the AIESEC platform.** You have taken an important first step toward an international experience that can transform your personal and professional journey.','AIESEC est une organisation internationale dirigée par des jeunes, présente dans plus de 100 pays. Elle propose des expériences de volontariat et de stage à l’étranger, encadrées par des standards qui garantissent la qualité, la sécurité et l’accompagnement des participants, avant, pendant et après leur expérience.':'AIESEC is a youth-led international organization present in more than 100 countries. It offers volunteer and internship experiences abroad, supported by standards designed to ensure quality, safety, and guidance before, during, and after each experience.','Ce que vous trouverez chez nous':'What you can expect from us','Des expériences internationales structurées, dans des projets et des organisations vérifiés':'Structured international experiences with vetted projects and organizations','Un développement concret de vos compétences : leadership, employabilité, ouverture culturelle':'Practical development of your leadership, employability, and intercultural skills','Un accompagnement humain et personnalisé par une équipe locale, à chaque étape':'Personal support from a local team at every step','Un réseau mondial de jeunes engagés, que vous rejoignez dès votre inscription':'A global network of engaged young people that you join when you sign up','Votre prochaine étape':'Your next step','Nous vous invitons à **réserver un créneau pour une première discussion en ligne** avec l’équipe locale en charge des échanges sortants. Cet échange nous permettra de comprendre votre profil, vos objectifs et vos contraintes, afin de vous orienter vers l’opportunité la plus adaptée.':'Please **book a time for an initial online conversation** with the local Outgoing Exchange team. We will learn about your profile, goals, and constraints so we can guide you toward an opportunity that suits you.','Réserver mon créneau →':'Book my time →','**Bon à savoir.** À ce stade, aucun paiement ne vous est demandé. Le détail des frais, le cas échéant, vous est communiqué de façon transparente lorsque vous êtes sélectionné(e) pour une opportunité.':'**Good to know.** No payment is required at this stage. If fees apply, we will explain them clearly if you are selected for an opportunity.','Si vous avez la moindre question avant notre échange, répondez simplement à ce message : nous reviendrons vers vous dans les meilleurs délais.':'If you have any questions before we speak, simply reply to this message. We will get back to you as soon as possible.',
'Votre projet d’expérience internationale avec AIESEC':'Your international experience project with AIESEC','Relance premier contact':'First contact follow-up','Relance':'Follow-up','Votre projet est-il toujours ==d’actualité== ?':'Is your project still ==on your mind==?','Bonjour {prenom}, je reviens vers vous concernant votre inscription sur la plateforme AIESEC.':'Hello {prenom}, I’m following up about your registration on the AIESEC platform.','Nous n’avons pas encore eu l’occasion d’échanger avec vous pour mieux comprendre votre projet et vos attentes en vue d’une éventuelle expérience internationale. Nous savons que les semaines passent vite et que les priorités évoluent : c’est pourquoi nous préférons prendre de vos nouvelles.':'We have not yet had a chance to discuss your project and what you hope to gain from an international experience. We know priorities can change and time moves quickly, so we wanted to check in.','Pourquoi échanger avec nous ?':'Why speak with us?','Faire le point sur votre profil, votre parcours d’études ou votre expérience professionnelle':'Review your profile, education, or work experience','Clarifier vos objectifs : compétences à développer, pays ou domaines qui vous intéressent':'Clarify your goals, including skills to develop, countries, and areas of interest','Découvrir les opportunités qui correspondent à votre projet et à votre calendrier':'Explore opportunities that fit your plans and schedule','Obtenir des réponses à toutes vos questions sur le déroulement, la sécurité et l’accompagnement':'Get answers about the process, safety, and support','Si votre projet est toujours d’actualité, vous pouvez simplement **réserver un créneau pour un échange individuel**. Quelques minutes suffisent.':'If your project is still active, you can **book a time for a one-to-one conversation**. It only takes a few minutes.','Réserver un échange →':'Book a conversation →','**Votre situation a changé ?** Si vous avez déjà avancé de votre côté ou si v oir l’opportunité →':'View opportunity →','**Les places sont limitées.** Une opportunité peut être fermée à tout moment : plus vous postulez tôt, plus vos chances d’être retenu(e) augmentent.':'**Places are limited.** An opportunity may close at any time. Applying early gives you the best chance of being selected.','Nous restons à votre disposition pour relire votre candidature, vous préparer à l’entretien et répondre à toutes vos questions.':'We are here to review your application, help you prepare for the interview, and answer your questions.',

'Langue de l’interface et des messages intégrés.':'Interface and built-in email language.','Interface et e-mails intégrés':'Interface and built-in emails','Les modèles personnalisés gardent la langue dans laquelle ils ont été rédigés.':'Custom templates keep the language in which they were written.',
'À quoi sert OGX Companion ?':'What is OGX Companion for?','OGX Companion aide les équipes Outgoing Exchange à écrire et envoyer rapidement des e-mails soignés et cohérents aux participants à l’échange. Chaque étape du parcours (premier contact, acceptation et paiement, séminaire de préparation, suivi, débriefing) dispose d’un modèle prêt à l’emploi. Vous renseignez les informations propres au participant : l’application complète le message et l’envoie depuis votre compte Gmail.':'OGX Companion helps Outgoing Exchange teams write and send polished, consistent emails to exchange participants. Ready-to-use templates cover each step: initial contact, acceptance and payment, preparation seminar, check-ins, and debriefing. Enter the participant’s details and the app fills in and sends the message from your Gmail account.',
'Comment envoyer un message à un participant ?':'How do I send a message to a participant?','Sur l’accueil, choisissez un modèle, ou touchez « Nouveau ».':'On Home, choose a template or tap “New”.','Dans l’onglet Participant, renseignez l’adresse e-mail et les champs demandés.':'On the Participant page, enter the email address and requested details.','Ouvrez l’onglet Aperçu (bouton central) et relisez le message.':'Open Preview (the center button) and review the message.','Touchez « Envoyer au participant » et confirmez.':'Tap “Send to participant” and confirm.',
'Que signifient les champs surlignés en orange ?':'What do the orange highlighted fields mean?','Dans l’aperçu, un texte orange entre crochets, par exemple [Prénom], signale une information manquante. L’envoi est bloqué tant qu’il en reste, afin d’éviter qu’un message incomplet ne parte. Complétez le champ dans l’onglet Participant ou, s’il s’agit d’un réglage d’équipe (signature, numéro de paiement, responsable local), dans Profil > Informations personnelles.':'In the preview, orange text in brackets, such as [First name], marks missing information. Sending is blocked until all required fields are complete. Fill it in on the Participant page or, for team details such as the signature, payment number, or local contact, under Profile > Personal information.',
'Comment fonctionne l’envoi par Gmail ?':'How does Gmail sending work?','L’application ne possède aucun serveur. Elle transmet le message à un petit script Google (Apps Script) que vous installez une fois dans votre compte. Ce script envoie le message depuis votre adresse Gmail ou Google Workspace : le participant voit donc votre adresse comme expéditeur, et le message apparaît dans votre dossier Envoyés.':'The app has no server. It sends the message to a small Google Apps Script that you install in your account. The script sends from your Gmail or Google Workspace address, so participants see your address and the message appears in your Sent folder.',
'Comment installer le script d’envoi ?':'How do I install the sending script?','Ouvrez script.google.com avec le compte qui enverra les e-mails et créez un nouveau projet.':'Open script.google.com using the account that will send the emails and create a new project.','Supprimez le code existant et collez le contenu du fichier apps-script.gs.':'Delete the existing code and paste in the contents of apps-script.gs.','Dans Paramètres du projet, ajoutez une propriété de script nommée OGX_PASS avec le mot de passe de votre choix.':'In Project settings, add a script property named OGX_PASS and set your chosen password.','Cliquez sur Déployer, puis Nouveau déploiement, type Application Web. Exécuter en tant que : Moi. Qui a accès : Tout le monde.':'Choose Deploy, then New deployment, and select Web app. Set “Execute as” to Me and “Who has access” to Anyone.','Autorisez l’accès lorsque Google le demande.':'Grant access when Google asks.','Copiez l’adresse du déploiement (elle se termine par /exec) dans Profil > Vérification de l’envoi, puis saisissez le mot de passe dans Profil > Sécurité.':'Copy the deployment URL (it ends in /exec) to Profile > Sending setup, then enter the password under Profile > Security.','Touchez « Vérifier la connexion ».':'Tap “Check connection”.',
'Le message « Mot de passe incorrect » s’affiche. Que faire ?':'The message “Incorrect password” appears. What should I do?','Cela signifie que le script a bien été joint, mais que le mot de passe saisi dans l’application diffère de celui enregistré dans le script. Vérifiez que la propriété s’appelle exactement OGX_PASS, retapez le même mot de passe à la main aux deux endroits, sans espace avant ou après, et évitez le remplissage automatique du navigateur.':'The script received the request, but the password in the app does not match the one saved in the script. Check that the property is named exactly OGX_PASS, type the same password manually in both places without extra spaces, and avoid browser autofill.',
'L’envoi échoue ou ne répond pas. Comment diagnostiquer ?':'Sending fails or does not respond. How can I troubleshoot it?','Dans Vérification de l’envoi, touchez « Vérifier la connexion ».':'On Sending setup, tap “Check connection”.','Si aucune réponse n’est reçue, vérifiez que le déploiement est en accès « Tout le monde » et que l’adresse se termine par /exec.':'If there is no response, check that the deployment is accessible to “Anyone” and that the URL ends in /exec.','Si vous avez modifié le script, créez une nouvelle version dans Déployer > Gérer les déploiements.':'If you edited the script, create a new version under Deploy > Manage deployments.','Dans Apps Script, ouvrez la page Exécutions : si une ligne doPost apparaît, la requête est bien arrivée au script.':'In Apps Script, open Executions. If a doPost entry appears, the request reached the script.','Sinon, copiez le rapport de diagnostic (Profil > Support) et transmettez-le à la personne qui administre l’application.':'Otherwise, copy the diagnostic report (Profile > Support) and send it to the app administrator.',
'Combien de messages puis-je envoyer par jour ?':'How many messages can I send per day?','Google limite les envois par Apps Script : 100 destinataires par jour avec un compte Gmail personnel, 1 500 avec un compte Google Workspace. Après chaque envoi, l’application affiche le nombre d’envois restants pour la journée. Le quota est renouvelé quotidiennement.':'Google limits Apps Script sending to 100 recipients per day for personal Gmail and 1,500 for Google Workspace. The app shows the remaining daily allowance after each send. The quota resets daily.',
'Comment ajouter ou changer le logo ?':'How do I add or change the logo?','Dans Profil > Informations personnelles, rubrique Logo, collez l’adresse https d’une image hébergée en ligne (finissant par .png, .jpg ou .svg). Un lien de téléchargement ou de partage (Drive, WeTransfer) ne fonctionne pas dans un e-mail. Laissez le champ vide pour utiliser le logo AIESEC par défaut.':'Under Profile > Personal information > Logo, paste the HTTPS address of an image hosted online (for example, a .png, .jpg, or .svg). A file-sharing link such as Drive or WeTransfer will not work in an email. Leave the field blank to use the default AIESEC logo.',
'Comment modifier le texte ou la mise en page d’un e-mail ?':'How do I change an email’s text or layout?','Ouvrez Outils > Avancé, choisissez le modèle et modifiez son code HTML. Pour être aidé, décrivez la modification souhaitée, copiez la demande générée pour l’IA, collez-la dans ChatGPT, Claude ou Gemini, puis collez le code obtenu dans l’application. Vérifiez l’aperçu et enregistrez. Vous pouvez rétablir le modèle d’origine à tout moment. Faites toujours un envoi test après une modification.':'Open Tools > Advanced, choose a template, and edit its HTML. To get help, describe the change, copy the AI prompt, paste it into ChatGPT, Claude, or Gemini, then paste the result back into the app. Review the preview and save. You can restore the original template at any time. Always send a test after editing.',
'Où sont enregistrées mes données ?':'Where is my data stored?','Tout est enregistré dans le navigateur de l’appareil que vous utilisez : réglages, participants, historique et modèles personnalisés. Rien n’est envoyé à un serveur de l’application. Conséquence : un autre appareil ou un autre navigateur ne voit pas ces données, et vider les données du navigateur les supprime. Pensez à exporter régulièrement la liste des participants.':'Settings, participants, history, and custom templates are stored in the browser on the device you use. Nothing is sent to an app server. Other devices and browsers cannot see this data, and clearing browser data deletes it. Export the participant list regularly.',
'Comment exporter la liste des participants ?':'How do I export the participant list?','Ouvrez Outils > Participants, puis touchez « Exporter en CSV ». Le fichier s’ouvre dans Excel ou Google Sheets. Si le téléchargement est bloqué, utilisez « Copier le CSV » et collez le contenu dans une feuille de calcul.':'Open Tools > Participants and tap “Export CSV”. Open the file in Excel or Google Sheets. If downloading is blocked, use “Copy CSV” and paste the contents into a spreadsheet.',
'Comment ajouter un objectif de développement durable (ODD) ?':'How do I add a Sustainable Development Goal (SDG)?','Dans l’onglet Participant, rubrique « Objectif de développement durable », choisissez l’ODD correspondant à l’opportunité. Une carte aux couleurs de cet objectif est ajoutée au message, avec un texte officiel que vous pouvez remplacer par le vôtre. Laissez « Aucun » pour ne pas l’afficher.':'On the Participant page, under “Sustainable Development Goal”, choose the SDG related to the opportunity. A matching card and official description will be added to the email; you can replace the description with your own text. Choose “None” to leave it out.',
'Comment sont calculées les dates limites ?':'How are deadlines calculated?','Pour l’acceptation et le paiement, la date limite est fixée automatiquement à un mois après la date d’acceptation saisie. Pour le choix de la date de départ, elle est fixée à une semaine après la date d’approbation. Pour modifier ces délais, adaptez le modèle dans Outils > Avancé.':'For acceptance and payment, the deadline is one month after the acceptance date you enter. For departure date selection, it is one week after the approval date. To change these intervals, edit the template under Tools > Advanced.',
'Puis-je utiliser l’application à plusieurs ?':'Can several team members use the app?','Oui. Chaque membre de l’équipe peut utiliser l’application sur son appareil avec le même script d’envoi : les messages partent alors depuis le compte Google qui a installé ce script. Chacun peut aussi installer son propre script pour envoyer depuis sa propre adresse. Dans les deux cas, les données enregistrées restent propres à chaque appareil.':'Yes. Team members can use the same sending script on their own devices; messages will be sent from the Google account that installed it. Each person can also install a separate script and send from their own address. Data remains separate on each device.',
'Comment effacer mes données ?':'How do I erase my data?','Dans Profil, touchez « Réinitialiser les données » en bas de page. Cette action supprime les réglages, les participants, l’historique et les modèles personnalisés de cet appareil. Elle est irréversible : exportez d’abord les données dont vous avez besoin.':'In Profile, tap “Reset data” at the bottom of the page. This removes settings, participants, history, and custom templates from this device. This cannot be undone, so export any data you need first.',
'Les modèles personnalisés gardent la langue dans laquelle ils ont été rédigés.':'Custom templates keep the language in which they were written.',
'Toutes vos informations sont renseignées. Vous pouvez désormais envoyer vos messages.':'All required information is complete. You can now send messages.','La connexion à votre script Gmail fonctionne : vos messages peuvent partir.':'Your Gmail script is connected and ready to send messages.',
