function chip(i,t,p){return '<button class="chip" type="button" data-go="'+p+'">'+ic(i)+t+'</button>'}
function dAcc(){var n=setupDone(),nm=(V.sig_nom||'').trim().split(/\s+/)[0],l=hist.filter(function(h){return !h.test})[0];
 $('p-accueil').innerHTML='<h1 class="hi">Bonjour'+(nm?', '+E(nm):'')+'</h1>'+
 (n<REQ.length?'<div class="card"><h3>Configuration</h3><div class="mute">'+n+' sur '+REQ.length+' informations requises renseignées</div><div class="bar"><i style="width:'+Math.round(n/REQ.length*100)+'%"></i></div><div class="acts"><button class="btn p" data-go="infos" type="button">Compléter mes informations</button></div></div>':'')+
 sec('Modèles d’e-mails')+'<div class="hs">'+T.map(function(t,i){return '<button class="tcard" type="button" data-t="'+t.id+'"><span class="gi g'+(i%5)+'"><svg class="i" viewBox="0 0 24 24">'+TG[t.id]+'</svg></span><span class="tag">'+t.s+'</span><b>'+t.n+'</b><small>'+DSC[t.id]+'</small></button>'}).join('')+'</div>'+
 sec('Historique','historique')+(l?'<div class="card last"><b>'+E(l.t)+'</b><small>'+E(l.to)+' · '+fmt(l.d)+'</small></div>':'<div class="card last"><b>Aucun envoi pour l’instant</b><small>Vos messages envoyés apparaîtront ici.</small></div>')+
 '<div class="chips">'+chip('card','Mes informations','infos')+chip('db','Base de données','base')+chip('clock','Historique','historique')+chip('help','Aide','aide')+'</div>'+
 '<div class="qs"><div class="r"><select id="qm" aria-label="Modèle">'+T.map(function(t){return '<option value="'+t.id+'"'+(t.id===cur?' selected':'')+'>'+t.n+'</option>'}).join('')+'</select></div><input id="qe" type="email" placeholder="Adresse e-mail du participant" value="'+E(V.email||'')+'" autocomplete="off"><div style="display:flex"><button class="go" id="qgo" type="button" aria-label="Continuer">'+ic('send')+'</button></div></div>'}
function bar(){var t=tpl(),k=t.f.filter(function(x){return (V[x]||'').trim()}).length;return '<h3>Progression</h3><div class="mute">'+k+' champ(s) renseigné(s) sur '+t.f.length+'</div><div class="bar"><i style="width:'+Math.round(k/t.f.length*100)+'%"></i></div>'}
function dEp(){var t=tpl(),n=setupDone();
 $('p-ep').innerHTML=head('Informations du participant','Renseignez les champs du message.')+'<div class="list">'+it('mail',t.n,'Modèle sélectionné · modifier','accueil')+'</div>'+
 (n<REQ.length?'<div class="card warn">Votre configuration est incomplète. <a href="#infos" style="color:inherit;font-weight:600">Compléter mes informations</a></div>':'')+
 '<div class="card" id="pr">'+bar()+'</div><div class="card"><h3>Champs du message</h3><div class="grid2">'+t.f.map(field).join('')+'</div></div>'+
 '<div class="card"><h3>Objectif de développement durable (facultatif)</h3><div class="mute">Ajoutez au message la carte de l’ODD lié à l’opportunité.</div>'+field('odd')+field('odd_texte')+'</div>'+
 '<div class="acts"><button class="btn p" data-go="apercu" type="button">Afficher l’aperçu</button><button class="btn" id="saveep" type="button">Enregistrer le participant</button><button class="btn d" id="newep" type="button">Réinitialiser</button></div>'}
function dInf(){var G=[['','Entité et signature',['entite','sig_nom','sig_role','from_name']],['','Responsable local (LCVP)',['lcvp_nom','lcvp_contact','lcvp_email']],['','Paiement',['numero_paiement','mode_paiement','beneficiaire']],['','Logo',['logo_url']],['','Envoi par Gmail',['script_url','pass','email_test']]];
 $('p-infos').innerHTML=head('Mes informations','Ces informations sont réutilisées dans tous les messages.')+G.map(function(g){return '<div class="card"><h3>'+g[1]+'</h3><div class="grid2">'+g[2].map(field).join('')+'</div>'+(g[1]==='Logo'?'<div id="lgp"></div><div class="mute" style="margin-top:8px">Adresse https d’une image hébergée. En l’absence de logo, le logotype texte AIESEC est utilisé.</div>':'')+(g[1]==='Envoi par Gmail'?'<div class="acts"><button class="btn" id="chk" type="button">Vérifier la connexion</button></div><div class="st" id="chs"></div><div class="mute" style="margin-top:8px">L’adresse du script se termine par /exec. Voir l’onglet Aide pour l’installation.</div>':'')+'</div>'}).join('')+'<div class="mute">Enregistrement automatique dans ce navigateur ; ces réglages ne sont pas synchronisés avec d’autres appareils.</div>';lg()}
function lg(){var e=$('lgp');if(e)e.innerHTML=/^https:\/\//.test(V.logo_url||'')?'<img class="lg" src="'+E(V.logo_url)+'" alt="Logo" onerror="this.outerHTML=\'<div class=warn>Image introuvable.</div>\'">':''}
function dPrev(){var r=build(tpl()),m=miss.map(lab);
 $('p-apercu').innerHTML=head('Aperçu du message','Vérifiez le contenu avant l’envoi.')+'<div class="meta"><div><span>À</span><b>'+E(V.email||'—')+'</b></div><div><span>Objet</span>'+E(r.subject)+'</div></div><iframe id="prev" sandbox title="Aperçu"></iframe>'+
 '<div class="st" id="pst" role="status" aria-live="polite">'+(m.length?'<span class="warn">Champs à compléter : '+E(m.join(', '))+'</span>':'<span class="ok">Tous les champs requis sont renseignés.</span>')+'</div>'+
 '<div class="acts"><button class="btn p" id="send" type="button">Envoyer au participant</button><button class="btn" id="test" type="button">Envoyer un test</button><button class="btn" id="copy" type="button">Copier le code HTML</button></div>';$('prev').srcdoc=r.html}
function dHist(){$('p-historique').innerHTML=head('Historique','Messages envoyés depuis cet appareil.')+(hist.length?'<div class="list">'+hist.map(function(h){return '<div class="it" style="cursor:default"><span class="ic">'+ic('mail')+'</span><div><b>'+E(h.t)+(h.test?' (test)':'')+'</b><small>'+E(h.to)+' · '+fmt(h.d)+'</small></div></div>'}).join('')+'</div><div class="acts"><button class="btn d" id="clh" type="button">Effacer l’historique</button></div>':'<div class="empty"><b>Aucun envoi</b>Les messages envoyés apparaîtront ici.</div>')}
function dBase(){var a=Object.keys(db).map(function(k){return db[k]}).sort(function(x,y){return String(y.updatedAt||y.last||'').localeCompare(String(x.updatedAt||x.last||''))});
 $('p-base').innerHTML=head('Participants enregistrés','Carnet local des participants de cet appareil.')+'<div class="card"><h3>'+a.length+' participant(s)</h3><div class="mute">Exportez la liste au format CSV, compatible Excel et Google Sheets. Les données ne sont pas synchronisées ni sauvegardées automatiquement sur un serveur.</div><div class="acts"><button class="btn p" id="exp" type="button">Exporter en CSV</button><button class="btn" id="expc" type="button">Copier le CSV</button></div></div>'+
 (a.length?'<div class="list">'+a.map(function(e){return it('user',E(((e.prenom||'')+' '+(e.nom||'')).trim()||e.email),E(e.email)+(e.programme?' · '+E(e.programme):'')+' · '+(e.n||0)+' envoi(s)',E(e.email),'load')}).join('')+'</div>':'<div class="empty"><b>Base vide</b>Aucun participant enregistré.</div>')}
function dAide(){$('p-aide').innerHTML=head('Aide','Guide d’utilisation et dépannage.')+[
['Envoyer un message','<ol><li>Accueil : sélectionnez un modèle.</li><li>Participant : renseignez les champs.</li><li>Aperçu : vérifiez le message, puis sélectionnez « Envoyer au participant ».</li></ol>'],
['Installer l’envoi par Gmail','<ol><li>Ouvrez script.google.com, créez un projet et collez le contenu du fichier apps-script.gs.</li><li>Dans les propriétés du script, ajoutez OGX_PASS avec le mot de passe de votre choix.</li><li>Déployez en application Web : exécution « Moi », accès « Tout le monde ».</li><li>Saisissez l’adresse du déploiement (se terminant par /exec) et le mot de passe dans Mes informations.</li></ol>'],
['Ajouter le logo','<p>Dans Mes informations, rubrique Logo, saisissez l’adresse https d’une image hébergée. Un lien de téléchargement ou de partage ne fonctionne pas dans un e-mail.</p>'],
['Limites d’envoi','<p>Un compte Gmail personnel permet 100 destinataires par jour, un compte Google Workspace 1 500.</p>'],
 ['Un message ne part pas','<p>Vérifiez l’adresse du script, le mot de passe et le dossier Envoyés de Gmail. Certains environnements d’aperçu bloquent l’envoi : publiez l’application et utilisez son adresse hébergée.</p>'],
['Champs en surbrillance orange','<p>Ils signalent une information manquante dans l’aperçu. L’envoi est bloqué tant qu’il en reste.</p>']].map(function(x){return '<details class="card"><summary>'+x[0]+'</summary>'+x[1]+'</details>'}).join('')}
function dPlus(){$('p-plus').innerHTML=head('Outils','Paramètres et données.')+'<div class="list">'+it('card','Mes informations','Équipe, responsable local, paiement, logo, envoi','infos')+it('db','Base de données','Participants et export CSV','base')+it('clock','Historique','Messages envoyés','historique')+it('help','Aide','Guide et dépannage','aide')+'</div>'}
var DRAW={accueil:dAcc,ep:dEp,infos:dInf,apercu:dPrev,historique:dHist,base:dBase,aide:dAide,plus:dPlus};
function sync(){document.querySelectorAll('input[id^="f_"],select[id^="f_"]').forEach(function(e){var k=e.id.slice(2),sc=e.closest('section');if(!F[k]||(sc&&sc.hidden))return;if(e.value!==''||V[k]===undefined)V[k]=e.value});save()}
function show(p){sync();if(!DRAW[p])p='accueil';page=p;PAGES.forEach(function(x){$('p-'+x).hidden=x!==p});
 document.querySelectorAll('.nb').forEach(function(b){var q=b.getAttribute('data-p');b.classList.toggle('on',q===p||(q==='plus'&&(p==='infos'||p==='base'||p==='aide'||p==='historique')))});
 var sb=p==='infos'||p==='base'||p==='aide'||p==='historique';$('back').hidden=!sb;$('pill').hidden=sb;var nn=(V.sig_nom||'').trim().split(/\s+/);$('av').textContent=((nn[0]||'').charAt(0)+(nn[1]||'').charAt(0)).toUpperCase()||'·';DRAW[p]();window.scrollTo(0,0)}
function go(p){if(location.hash==='#'+p)show(p);else location.hash=p}
window.addEventListener('hashchange',function(){show(location.hash.slice(1))});
function upsert(){var e=(V.email||'').trim().toLowerCase();if(!e)return false;var o=db[e]||{n:0},now=new Date().toISOString();
 Object.keys(F).forEach(function(k){if(F[k][2])return;if(String(V[k]||'').trim())o[k]=V[k];else delete o[k]});o.email=e;o.updatedAt=now;o.modele=tpl().n;db[e]=o;pt('ogx-db',db);persistDraft(e);return true}
function csv(){var c=['prenom','nom','email','programme','projet','destination','modele','lastSentAt','updatedAt','n'],q=function(s){var v=String(s==null?'':s);if(/^\s*[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};
 return '\ufeff'+['prenom','nom','email','programme','projet','destination','dernier_modele','dernier_envoi','modifie_le','nb_envois'].join(',')+'\n'+Object.keys(db).map(function(k){var o=db[k];return c.map(function(x){return q(x==='lastSentAt'?(o.lastSentAt||''):(x==='updatedAt'?(o.updatedAt||o.last||''):o[x]))}).join(',')}).join('\n')}
document.addEventListener('input',function(e){var k=(e.target.id||'').slice(2);if(!F[k])return;V[k]=e.target.value;save();
 if(page==='ep'&&$('pr'))$('pr').innerHTML=bar();if(k==='logo_url')lg()});
document.addEventListener('change',function(e){var k=(e.target.id||'').slice(2);if(F[k]){V[k]=e.target.value;save()}});
document.addEventListener('focusout',function(){sync()});document.addEventListener('paste',function(){setTimeout(sync,60)});setInterval(sync,1500);
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var id=b.id,g=b.getAttribute('data-go'),t=b.getAttribute('data-t'),l=b.getAttribute('data-load'),p=b.getAttribute('data-p');
 if(p)return go(p);if(g)return go(g);if(t){cur=t;return go('ep')}
 if(l){switchParticipant(l,db[l]);toast('Participant chargé');return go('ep')}
 if(id==='back'){if(typeof history!=='undefined'&&history.length>1)history.back();else go('plus');return}
 if(id==='av')return go('infos');
 if(id==='qgo'){var m=$('qm').value,em=($('qe').value||'').trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){toast('Saisissez une adresse e-mail valide.');return}cur=m;switchParticipant(em);return go('ep')}
 if(id==='newep'){Object.keys(V).forEach(function(k){if(!F[k][2])delete V[k]});save();return dEp()}
 if(id==='saveep')return toast(upsert()?'Participant enregistré':'Renseignez d’abord son adresse e-mail');
 if(id==='clh'){if(confirm('Effacer tout l’historique ?')){hist=[];pt('ogx-h2',hist);dHist()}return}
 if(id==='copy'||id==='expc'){var s=id==='copy'?build(tpl()).html:csv();try{navigator.clipboard.writeText(s).then(function(){toast('Copié')},function(){toast('Copie impossible dans cet environnement')})}catch(x){toast('Copie impossible dans cet environnement')}return}
 if(id==='exp'){try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv()],{type:'text/csv;charset=utf-8'}));a.download='ogx-ep.csv';document.body.appendChild(a);a.click();a.remove();toast('Export lancé')}catch(x){toast('Téléchargement impossible : utilisez « Copier le CSV »')}return}
 if(id==='chk')return chk();
 if(id==='send')return doSend(false);if(id==='test')return doSend(true)});
async function chk(){sync();var o=$('chs'),u=(V.script_url||'').trim();
 if(!/^https:\/\/.+\/exec$/.test(u)){o.innerHTML='<span class="err">L’adresse du script doit commencer par https:// et se terminer par /exec.</span>';return}
 o.innerHTML='<span class="mute">Vérification…</span>';
 try{var r=await fetch(u),j=await r.json();o.innerHTML=j.ok?'<span class="ok">Connexion établie. Le script répond correctement.</span>':'<span class="err">Le script répond, mais de façon inattendue.</span>'}
 catch(e){o.innerHTML='<span class="err">Aucune réponse. Vérifiez que le déploiement est en accès « Tout le monde ». Si l’application est ouverte dans l’aperçu Claude, la vérification est bloquée : utilisez la version hébergée.</span>'}}
async function doSend(test){sync();var r=build(tpl()),to=test?(V.email_test||'').trim():(V.email||'').trim(),st=$('pst'),b=$(test?'test':'send'),old=b.textContent,bad=function(m){st.innerHTML='<span class="err">'+m+'</span>'};
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to))return bad(test?'Renseignez votre adresse e-mail de test dans Mes informations.':'Adresse e-mail du participant invalide.');
 var invalid=$('p-ep').querySelector('input:invalid,select:invalid');if(invalid)return bad('Vérifiez le champ « '+E(lab((invalid.id||'').slice(2)))+' ».');
 if(miss.length)return bad('Veuillez d’abord compléter : '+E(miss.map(lab).join(', ')));
 if(!/^https:\/\//.test((V.script_url||'').trim()))return bad('L’adresse du script n’est pas renseignée. <a href="#infos" style="color:inherit;font-weight:700">Ouvrir Mes informations</a> (rubrique Envoi par Gmail). Le script doit d’abord être installé : voir l’onglet Aide.');
 if(!(V.pass||'').trim())return bad('Le mot de passe du script n’est pas renseigné. <a href="#infos" style="color:inherit;font-weight:700">Ouvrir Mes informations</a>.');
 if(!confirm('Confirmer l’envoi à '+to+' ?'))return;b.disabled=true;b.textContent='Envoi en cours…';
 try{var res=await fetch(V.script_url.trim(),{method:'POST',body:JSON.stringify({pass:V.pass.trim(),to:to,subject:(test?'[TEST] ':'')+r.subject,html:r.html,text:mailText(r.html),name:V.from_name||'AIESEC'})}),j=await res.json();
  if(j.ok){st.innerHTML='<span class="ok">Message envoyé. Envois restants aujourd’hui : '+E(j.remaining)+'.</span>';hist.unshift({t:tpl().n,id:cur,to:to,d:new Date().toISOString(),test:!!test});hist=hist.slice(0,200);pt('ogx-h2',hist);
   if(!test){upsert();var e=db[(V.email||'').trim().toLowerCase()];if(e){e.n=(e.n||0)+1;e.lastSentAt=new Date().toISOString();pt('ogx-db',db)}}toast('Message envoyé')}
  else bad('Refusé : '+E(j.error||'erreur'))}
 catch(x){bad('Envoi impossible ou réponse illisible. Vérifiez le dossier Envoyés de Gmail, l’adresse du script et le fait que l’application est ouverte depuis son adresse publiée.')}
 b.disabled=false;b.textContent=old}
show(location.hash.slice(1)||'accueil');
})();
</script>
</body>
